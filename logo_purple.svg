<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep obsidian dark background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140D24" />
      <stop offset="50%" stop-color="#0D0818" />
      <stop offset="100%" stop-color="#07040C" />
    </linearGradient>

    <!-- Electric Royal / Cyberpunk Purple Gradient -->
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Outer rim metallic violet gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#4C1D95" stop-opacity="0.4" />
    </linearGradient>

    <!-- Ambient radial glow behind headset -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9333EA" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#9333EA" stop-opacity="0.0" />
    </radialGradient>
  </defs>

  <!-- Squircle App Badge Container (iOS / Windows Fluent Squircle) -->
  <rect x="24" y="24" width="464" height="464" rx="104" ry="104" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="8" />

  <!-- Radial Atmospheric Purple Glow -->
  <circle cx="256" cy="256" r="180" fill="url(#centerGlow)" />

  <!-- Bold Minimalist Gaming Headset Mark -->
  <g id="headset">
    <!-- Top Arc: Continuous Precision Headband -->
    <path d="M 136 250 A 120 120 0 0 1 376 250" fill="none" stroke="url(#purpleGlow)" stroke-width="32" stroke-linecap="round" />

    <!-- Left Ear Cup: Chamfered Geometric Rounded Rectangle -->
    <rect x="100" y="224" width="56" height="116" rx="28" fill="url(#purpleGlow)" />
    <!-- Left Inner Accent Line -->
    <rect x="118" y="248" width="8" height="68" rx="4" fill="#0D0818" opacity="0.45" />

    <!-- Right Ear Cup -->
    <rect x="356" y="224" width="56" height="116" rx="28" fill="url(#purpleGlow)" />
    <!-- Right Inner Accent Line -->
    <rect x="386" y="248" width="8" height="68" rx="4" fill="#0D0818" opacity="0.45" />

    <!-- Dynamic Mic Boom Curve -->
    <path d="M 144 320 C 144 380 200 410 246 410" fill="none" stroke="url(#purpleGlow)" stroke-width="16" stroke-linecap="round" />

    <!-- Mic Capsule Capsule Indicator -->
    <rect x="240" y="398" width="34" height="24" rx="12" fill="#E9D5FF" />
    <!-- Glowing Status Core on Mic -->
    <circle cx="257" cy="410" r="5" fill="#7C3AED" />
  </g>
</svg>
